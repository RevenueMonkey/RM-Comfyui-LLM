name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Read release notes
        shell: python
        run: |
          import os
          import re
          import uuid
          from pathlib import Path

          metadata = Path("pyproject.toml").read_text(encoding="utf-8")
          version = re.search(r'^version\s*=\s*"([^"]+)"', metadata, re.MULTILINE).group(1)
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          entry = re.search(
              rf"(?ms)^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\n(.+?)(?=^## |\Z)",
              changelog,
          )
          if not entry or not entry.group(1).strip():
              raise SystemExit(f"Missing dated release notes for {version} in CHANGELOG.md")
          notes = entry.group(0).strip()
          delimiter = uuid.uuid4().hex
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"COMFY_NODE_CHANGELOG<<{delimiter}\n{notes}\n{delimiter}\n")
          print(notes)
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: 'true'
